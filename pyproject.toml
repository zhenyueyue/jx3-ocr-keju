[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ocr-keju"
version = "0.1.0"
description = "Local OCR-driven JX3 exam question resolver with a local SQLite question bank."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx>=0.28,<1",
    "numpy>=1.26,<3",
    "onnxruntime>=1.20,<2",
    "opencv-python>=4.9,<5",
    "PySide6>=6.8,<7",
    "rapidfuzz>=3.9,<4",
    "rapidocr>=3.9,<4",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.10,<7",
    "pytest>=8.3,<9",
]

[project.scripts]
ocr-keju = "ocr_keju.cli:main"
ocr-keju-gui = "ocr_keju.ui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ocr_keju"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
